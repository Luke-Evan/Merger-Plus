name: Deploy donate page to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 用户页 https://<user>.github.io/ -> "/"
      # 项目页 https://<user>.github.io/<repo>/ -> "/<repo>/"
      - name: Resolve PUBLIC_PATH
        id: pubpath
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")
          NAME_LC=$(echo "$REPO_NAME" | tr "[:upper:]" "[:lower:]")
          if [ "$NAME_LC" = "$OWNER.github.io" ]; then
            PUBLIC_PATH="/"
          else
            PUBLIC_PATH="/$REPO_NAME/"
          fi
          echo "PUBLIC_PATH=$PUBLIC_PATH" >> "$GITHUB_OUTPUT"
          echo "Using PUBLIC_PATH=$PUBLIC_PATH"

      - name: Build
        run: npm run build
        env:
          PUBLIC_PATH: ${{ steps.pubpath.outputs.PUBLIC_PATH }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
